name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated agent files are up to date
        run: python3 scripts/gen_agent_files.py --check
      - name: The stories page is what data/stories.json says
        run: python3 scripts/gen_stories.py --check
      - name: Only public repositories are listed
        run: python3 scripts/check_public.py
      # The home page at / is built from cancho-ui at the commit pinned in scripts/build_site.sh, with the previous
      # page beside it at /classic/. The build checks the finished tree (scripts/check_site.py) and only then puts it
      # in place, and a failure stops the deploy: the site that is live stays as it is.
      - name: Build the site (/, /classic/, /next/)
        run: bash scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
