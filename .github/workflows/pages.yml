name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated agent files are up to date
        run: python3 scripts/gen_agent_files.py --check
      - name: Only public repositories are listed
        run: python3 scripts/check_public.py
      - name: Build site
        run: bash scripts/build_site.sh
      # A preview of the cancho-ui version of the page at /next/. It is optional: if it cannot be
      # built the live site is still deployed, without it.
      - name: Build the cancho-ui preview (/next/)
        continue-on-error: true
        run: bash scripts/build_next.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
