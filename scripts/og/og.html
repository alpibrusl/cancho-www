<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>cancho share card</title>
<link rel="stylesheet" href="../../assets/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { display: grid; grid-template-columns: 1.08fr 1fr; align-items: stretch; font-family: var(--font); }
  .copy { padding: 64px 0 56px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brandrow { display: flex; align-items: center; gap: 14px; font: 700 30px var(--mono); letter-spacing: -.01em; }
  .brandrow img { width: 52px; height: 52px; border-radius: 50%; }
  .brandrow span { font: 600 15px var(--mono); color: var(--warn); background: var(--warn-bg); padding: 4px 12px; border-radius: 8px; margin-left: 6px; }
  h1 { font-size: 92px; line-height: .96; margin: 0; letter-spacing: -.04em; }
  .sub { font-size: 27px; line-height: 1.4; color: var(--muted); margin: 22px 0 0; max-width: 520px; }
  .url { font: 500 20px var(--mono); color: var(--muted); }
  .art { position: relative; margin: 0; background: linear-gradient(var(--sky), color-mix(in srgb, var(--sky) 55%, var(--bg))); overflow: hidden; }
  .art svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .static .drop, .static .sun-wrap, .static .cloud, .static .birds { animation: none !important; }
  .static .layer { transform: none !important; }
</style></head>
<body class="static" data-theme="light">
  <div class="copy">
    <div class="brandrow"><img src="../../logo-mark.png" alt=""> cancho <span>Pre-1.0 · alpha</span></div>
    <div><h1>Granite.<br><em>No mortar.</em></h1>
      <p class="sub">A language where ownership and authority are in the type, and the ecosystem built with it.</p></div>
    <div class="url">alpibrusl.github.io/cancho-www</div>
  </div>
  <div class="art"><svg id="scene-svg" viewBox="0 0 640 600" preserveAspectRatio="xMidYMax slice"></svg></div>
  <script src="../../assets/rocks.js"></script><script src="../../assets/scene.js"></script>
  <script>window.Scene.draw(document.getElementById('scene-svg'));</script>
</body></html>
